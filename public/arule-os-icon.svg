<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Arule OS icon</title>
  <desc id="desc">Modern rounded dark app tile containing a glowing geometric letter A in emerald and cyan.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162337"/>
      <stop offset="0.52" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#070e1c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16e5a1"/>
      <stop offset="0.52" stop-color="#3be5c5"/>
      <stop offset="1" stop-color="#76caff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16e5a1"/>
      <stop offset="1" stop-color="#76caff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#1de9b4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1de9b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#surface)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#b8e1ff" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="128" cy="130" r="105" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="94" fill="none" stroke="#74d7da" stroke-opacity=".11" stroke-width="1.5"/>
  <!-- Subtle illuminated geometric A shadow -->
  <path d="M63 184 L113 72 Q128 42 143 72 L193 184" fill="none" stroke="#10f3bd" stroke-opacity=".25" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)"/>
  <!-- The distinct Arule monogram -->
  <path d="M63 184 L113 72 Q128 42 143 72 L193 184" fill="none" stroke="url(#mark)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 150 H160" fill="none" stroke="url(#bar)" stroke-width="17" stroke-linecap="round"/>
  <path d="M62 207 H194" fill="none" stroke="#8dece0" stroke-opacity=".18" stroke-width="2" stroke-linecap="round"/>
</svg>
